
name: Build Cantai Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check project files
        run: |
          echo "Cantai cloud builder is ready."
          echo "Waiting for Android project files."
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        if: ${{ hashFiles('app/build.gradle', 'app/build.gradle.kts') != '' }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        if: ${{ hashFiles('app/build/outputs/apk/debug/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Cantai-debug-APK
          path: app/build/outputs/apk/debug/*.apk
