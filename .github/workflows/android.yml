name: Build Cantai APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK parts
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: cantai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
